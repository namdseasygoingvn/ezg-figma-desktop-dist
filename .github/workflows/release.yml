name: release

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "ezg-figma-desktop commit"
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  SOURCE_REPO: namdseasygoingvn/ezg-figma-desktop
  # Self-signed, from secret APPLE_CERTIFICATE: the designated requirement names this
  # certificate instead of the build's cdhash, so macOS keeps granted permissions across updates.
  MAC_SIGNING_IDENTITY: EZG Figma Desktop Self-Signed
  RUST_TOOLCHAIN: "1.98.0"
  RELEASE_BODY: |
    EZG Figma Desktop: Figma manager, EZG tool panels and the EZG bridge hub.

    **macOS (Apple Silicon only):** download the `aarch64` `.dmg` and drag the app to Applications.
    First open: run `xattr -dr com.apple.quarantine "/Applications/EZG Figma Desktop.app"`, or allow it once in **System Settings → Privacy & Security → Open Anyway**.

    **Windows (x64):** download the `-setup.exe` and run it. SmartScreen warns once (unsigned): **More info → Run anyway**.

    Installed copies update themselves from this page.

jobs:
  # Versions live here, as tags of this repo: one patch above the newest tag, or the
  # source's tauri.conf.json version when someone raised it by hand.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      release_id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/checkout@v5
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ inputs.sha }}
          token: ${{ secrets.EZG_PAT }}
          path: source
          persist-credentials: false

      - id: next
        run: |
          CONF=$(node -p "require('./source/src-tauri/tauri.conf.json').version")
          LAST=$(git tag -l 'v*' --sort=-v:refname | head -1 | sed 's/^v//')
          NEXT=$(node -e '
            const p = (v) => (v || "0.0.0").split(".").map(Number)
            const [a, b, c] = p(process.argv[1]), conf = p(process.argv[2])
            const bumped = [a, b, c + 1]
            const cmp = (x, y) => x[0] - y[0] || x[1] - y[1] || x[2] - y[2]
            console.log((cmp(conf, bumped) > 0 ? conf : bumped).join("."))
          ' "$LAST" "$CONF")
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "last ${LAST:-none}, source $CONF -> $NEXT"

      # The tag is pushed before the draft so the assets get tag-pinned URLs, and the
      # draft is created once so the build matrix never races to create it.
      - id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ steps.next.outputs.version }}
          SHA: ${{ inputs.sha }}
        run: |
          git tag "$TAG"
          git push origin "refs/tags/$TAG"
          gh release create "$TAG" --draft --verify-tag --title "$TAG" \
            --notes "$RELEASE_BODY"$'\n\n'"Source: \`${SHA}\`"
          echo "id=$(gh release view "$TAG" --json databaseId -q .databaseId)" >> "$GITHUB_OUTPUT"

  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ inputs.sha }}
          token: ${{ secrets.EZG_PAT }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: test

      - name: Test
        working-directory: src-tauri
        run: cargo test --locked

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ inputs.sha }}
          token: ${{ secrets.EZG_PAT }}
          persist-credentials: false

      - name: Stamp the release version
        shell: bash
        run: |
          V=${{ needs.version.outputs.version }}
          node -e '
            const fs = require("fs"), f = "src-tauri/tauri.conf.json"
            const c = JSON.parse(fs.readFileSync(f, "utf8"))
            c.version = process.argv[1]
            if (process.argv[2] === "macOS") c.bundle.macOS.signingIdentity = process.argv[3]
            fs.writeFileSync(f, JSON.stringify(c, null, 2) + "\n")
          ' "$V" "$RUNNER_OS" "$MAC_SIGNING_IDENTITY"
          npm pkg set version="$V"

      - uses: mozilla-actions/sccache-action@v0.0.11

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: npm ci

      # Builds, signs the updater artifacts, uploads them to this repo's draft and
      # merges the platform into latest.json.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && env.MAC_SIGNING_IDENTITY || '' }}
        with:
          owner: namdseasygoingvn
          repo: ezg-figma-desktop-dist
          releaseId: ${{ needs.version.outputs.release_id }}
          tagName: v${{ needs.version.outputs.version }}
          releaseBody: ${{ env.RELEASE_BODY }}
          args: --target ${{ matrix.target }}

      # An unsealed arm64 bundle is reported as damaged and cannot be opened. An ad-hoc
      # signature would make macOS ask for every permission again after each update.
      - name: Check the macOS bundle is sealed by the self-signed certificate
        if: runner.os == 'macOS'
        run: |
          APP=$(node -p "require('./src-tauri/tauri.conf.json').productName")
          BUNDLE="src-tauri/target/${{ matrix.target }}/release/bundle/macos/$APP.app"
          codesign --verify --strict --verbose=2 "$BUNDLE"
          REQ=$(codesign -dr - "$BUNDLE" 2>&1)
          echo "$REQ"
          echo "$REQ" | grep -q 'certificate root = '

  # A release missing a platform stays a draft, where releases/latest cannot serve
  # its half-populated latest.json to the updater.
  publish:
    needs: [version, test, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      ID: ${{ needs.version.outputs.release_id }}
    steps:
      - name: Check latest.json covers every signed artifact
        run: |
          gh api --paginate "repos/$GH_REPO/releases/$ID/assets" > assets.json
          gh api "repos/$GH_REPO/releases/assets/$(
            jq -r '.[] | select(.name == "latest.json") | .id' assets.json
          )" -H 'Accept: application/octet-stream' > latest.json
          MISSING=$(jq -r --slurpfile latest latest.json '
            [.[].name | select(endswith(".sig")) | rtrimstr(".sig")]
            - [$latest[0].platforms[].url | split("/") | last]
            | join(" ")' assets.json)
          if [ -n "$MISSING" ]; then
            echo "::error::latest.json has no entry for: $MISSING"
            exit 1
          fi

      - name: Publish
        run: gh api -X PATCH "repos/$GH_REPO/releases/$ID" -F draft=false
